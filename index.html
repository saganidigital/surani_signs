    <script>
      (function () {
        try {
          var saved = localStorage.getItem('patch4less-theme') || localStorage.getItem('surani-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();

    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 1.5rem;
        background-color: #ffffff;
        color: #0f172a;
      }
      html.dark #initial-splash {
        background-color: #0f1218;
        color: #ffffff;
      }
      .initial-splash-inner {
        width: 100%;
        max-width: 24rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .initial-splash-logo-wrap {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
      }
      .initial-splash-emblem {
        width: 2.75rem;
        height: 2.75rem;
        flex-shrink: 0;
        color: #1a1d24;
      }
      html.dark .initial-splash-emblem {
        color: #e2e8f0;
      }
      .initial-splash-wordmark {
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        font-size: 1.875rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        line-height: 1;
        text-transform: uppercase;
      }
      .initial-splash-teal {

      }
      .initial-splash-num {
        color: #0f172a;
      }
      html.dark .initial-splash-num {

      }
      .initial-splash-track {
        width: 100%;
        height: 3px;
        border-radius: 9999px;
        background-color: #e2e8f0;
        overflow: hidden;
      }
      html.dark .initial-splash-track {
        background-color: rgba(255, 255, 255, 0.1);
      }
      .initial-splash-bar {
        height: 100%;
        width: 4%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #008f83, #00b8a9, #00e5d1);
      }
      .initial-splash-meta {

        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #64748b;
      }
      html.dark .initial-splash-meta {
        color: #94a3b8;
      }

              <div class="initial-splash-bar"></div>
