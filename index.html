<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="geo.region" content="US-TX" />
    <meta name="geo.placename" content="Farmers Branch, Dallas, Texas" />
    <meta name="geo.position" content="32.922752;-96.908986" />
    <meta name="ICBM" content="32.922752, -96.908986" />
    <title>Custom Signs in Dallas TX | Sign Maker &amp; Sign Company | Patch4Ever</title>
    <meta
      name="description"
      content="Patch4Ever is a Dallas sign company. We design, build, and install custom signs, channel letters, monument signs, vehicle wraps, banners, and digital signage across Dallas and DFW. Get a free quote."
    />
    <link rel="preconnect" href="https://suranisigns.com" />
    <link rel="dns-prefetch" href="https://suranisigns.com" />
    <link rel="preload" as="image" href="/images/logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/teal-wave-bg.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="https://suranisigns.com/favicon-32x32.png" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('surani-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 1.5rem;
        background-color: #ffffff;
        color: #0f172a;
      }
      html.dark #initial-splash {
        background-color: #0f1218;
        color: #ffffff;
      }
      .initial-splash-inner {
        width: 100%;
        max-width: 24rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .initial-splash-logo-wrap {
        transition: all 0.3s ease;
      }
      html.dark .initial-splash-logo-wrap {
        background-color: rgba(255, 255, 255, 0.95);
        padding: 0.625rem 1rem;
        border-radius: 1rem;
      }
      .initial-splash-logo {
        height: 3rem;
        width: auto;
        object-fit: contain;
        display: block;
      }
      .initial-splash-track {
        width: 100%;
        height: 3px;
        border-radius: 9999px;
        background-color: #e2e8f0;
        overflow: hidden;
      }
      html.dark .initial-splash-track {
        background-color: rgba(255, 255, 255, 0.1);
      }
      .initial-splash-bar {
        height: 100%;
        width: 4%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #008f83, #00b8a9, #00e5d1);
      }
      .initial-splash-meta {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #64748b;
      }
      html.dark .initial-splash-meta {
        color: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-[#0f1218] text-slate-800 dark:text-slate-100 antialiased selection:bg-teal-500 selection:text-white transition-colors duration-300">
    <div id="root">
      <div id="initial-splash" aria-label="Loading Patch4Ever">
        <div class="initial-splash-inner">
          <div class="initial-splash-logo-wrap">
            <img src="/images/logo.png" alt="Patch4Ever" class="initial-splash-logo" />
          </div>
          <div style="width: 100%; display: flex; flex-direction: column; gap: 0.75rem;">
            <div class="initial-splash-track">
              <div class="initial-splash-bar"></div>
            </div>
            <div class="initial-splash-meta">
              <span>Loading Photos &amp; Media</span>
              <span style="font-size: 0.875rem; font-weight: 700;">0%</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
